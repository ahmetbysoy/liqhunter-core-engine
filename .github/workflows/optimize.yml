name: Replay & Optimization Engine

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run engine tests
        run: npm run test:engine

  optimize:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run nightly replay optimization
        run: node engine/run-optimizer.js
        env:
          TARGET_SYMBOL: BTCUSDT
          LOOKBACK_HOURS: 168
          OUTPUT_DIR: public

      - name: Normalize report filename for the dashboard
        run: |
          generated=$(ls public/optimizer-*.json | head -n 1)
          cp "$generated" public/latest-report.json

      - name: Upload optimizer report
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-report
          path: public/optimizer-*.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish report for the dashboard
        run: |
          git config user.name "LiqHunter Engine"
          git config user.email "engine@local"
          git add -f public/latest-report.json
          git diff --staged --quiet || git commit -m "chore: publish latest optimizer report"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
